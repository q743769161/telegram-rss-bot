# ⚠️ 警告：此 Worker 接了 Git 自动部署。不要在 Cloudflare dashboard 上点“保存/部署”，
# dashboard 的版本上传会用它缓存的旧代码快照覆盖线上（2026-10-17 已因此回滚过一次）。
# 改环境变量/绑定后如发现机器人变慢，通知我推一次代码即可恢复。

name = "rss-telegram-bot"
main = "src/worker.js"
compatibility_date = "2024-01-01"

# D1 绑定在 Cloudflare 后台 Settings → Bindings 里加（变量名 DB），
# 不要把 database_id 写进仓库；TELEGRAM_BOT_TOKEN 同样只放后台环境变量。

# Cron触发器 (每10分钟检查一次RSS)
[triggers]
crons = ["*/10 * * * *"]
