# ⚠️ 警告：此 Worker 接了 Git 自动部署。不要在 Cloudflare dashboard 上点“保存/部署”，
# dashboard 的版本上传会用它缓存的旧代码快照覆盖线上（2026-10-17 已因此回滚过一次）。
# 改环境变量/绑定后如发现机器人变慢，通知我推一次代码即可恢复。

name = "rss-telegram-bot"
main = "src/worker.js"
compatibility_date = "2024-01-01"

# D1 绑定已写进下方 [[d1_databases]]（database_id 非密钥，可进仓库），
# Git 部署会自动带上，不会再掉。TELEGRAM_BOT_TOKEN 是密钥，只能放后台，
# 每次 Git 部署后需在后台重新添加一次。

[[d1_databases]]
binding = "DB"
database_name = "rss-bot-db"
database_id = "c72318d5-fd8b-49c8-9ef8-f04284b49243"

# Cron触发器 (每10分钟检查一次RSS)
[triggers]
crons = ["*/10 * * * *"]
